name: windows
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  windows:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
          - php: "8.5"
            ts: "nts"
            args: "--enable-json"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          args: ${{ matrix.args }}
          # yac's Windows shared memory is a per-user named file mapping, so
          # parallel test workers attach to the same region and corrupt each
          # other; tests must run serially
          test-workers: 1

  windows-x86:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }}, x86)"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        ts: ["nts"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x86
          ts: ${{ matrix.ts }}
          # x86 PHP CLI is capped at 128M, and yac's shared memory forbids
          # parallel workers anyway; run serially
          test-workers: 1
