name: windows
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  windows:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
          - php: "8.5"
            ts: "nts"
            args: "--enable-json"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          args: ${{ matrix.args }}
          # yac's Windows shared memory is a per-user named file mapping, so
          # parallel test workers attach to the same region and corrupt each
          # other; tests must run serially
          test-workers: 1

  windows-x86:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }}, x86)"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        ts: ["nts"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x86
          ts: ${{ matrix.ts }}
          # x86 PHP CLI is capped at 128M, and yac's shared memory forbids
          # parallel workers anyway; run serially
          test-workers: 1
      # run-tests.php on x86 dies at tests/043.phpt with a 4MB allocation;
      # keep the failed test's evidence (.out/.exp/.diff) to see what the
      # test actually produced before the runner crashed
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86-test-evidence-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            build/*/tests/*.out
            build/*/tests/*.exp
            build/*/tests/*.diff
            build/*/tests/*.log
            build/*/tests/*.php
            build/*/tests/*.sh
          if-no-files-found: ignore
